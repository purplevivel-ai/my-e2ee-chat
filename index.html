<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Одноразовый E2EE Чат</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e0e10; color: #e0e0e0; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .card { background: #18181b; width: 100%; max-width: 480px; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); display: flex; flex-direction: column; height: 90vh; }
    h2 { margin: 0 0 15px 0; color: #fff; text-align: center; font-size: 20px; }
    input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #27272a; background: #27272a; color: #fff; font-size: 15px; outline: none; }
    button { background: #2563eb; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:active { opacity: 0.8; }
    button.danger { background: #dc2626; }
    button.copy-btn { background: #16a34a; margin-top: 10px; font-size: 13px; padding: 8px; }
    
    #chatBox { flex: 1; overflow-y: auto; padding: 10px; margin: 15px 0; background: #09090b; border-radius: 12px; display: flex; flex-direction: column; gap: 8px; }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
    .msg-wrapper.my { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.peer { align-self: flex-start; align-items: flex-start; }
    
    .msg { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg-wrapper.my .msg { background: #2563eb; color: #ffffff; border-bottom-right-radius: 2px; }
    .msg-wrapper.peer .msg { background: #27272a; color: #f4f4f5; border-bottom-left-radius: 2px; }
    
    .author { font-size: 11px; color: #a1a1aa; margin-bottom: 3px; padding: 0 4px; }
    
    .msg.sys { background: #3f2e00; color: #fde047; font-size: 12px; text-align: center; width: 100%; border-radius: 8px; align-self: center; padding: 6px 10px; }
    .hidden { display: none !important; }
    
    #securityError { display: none; color: #ef4444; background: #450a0a; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; border: 1px solid #7f1d1d; }
  </style>
</head>
<body>

<div class="card">
  <h2>Одноразовый E2EE Чат</h2>
  
  <div id="securityError">
    <b>Ошибка безопасности!</b><br>
    Для работы шифрования требуется HTTPS или localhost.
  </div>

  <div id="setupScreen">
    <input id="nickInput" placeholder="Ваш никнейм" maxlength="20" />
    <button onclick="createRoom()">Создать новый чат</button>
    <hr style="border-color: #27272a; margin: 20px 0;">
    <input id="roomIdInput" placeholder="ID комнаты (UUID)" />
    <button onclick="joinRoom()" style="background: #16a34a;">Войти по ID</button>
  </div>

  <div id="chatScreen" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
    <div style="display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 8px 12px; border-radius: 10px;">
      <span style="font-size: 14px;">Чат: <b id="displayRoomId" style="color: #4ade80; user-select: all;">----</b></span>
      <button onclick="destroyChatManual()" class="danger" style="width: auto; padding: 6px 12px; margin: 0; font-size: 13px;">Уничтожить</button>
    </div>
    
    <div id="chatBox"></div>

    <div style="display: flex; gap: 8px;">
      <input id="messageInput" placeholder="Зашифрованное сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()" style="width: 90px; margin-top: 8px;">Отправить</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // Проверка безопасного контекста для Web Crypto API
  if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('securityError').style.display = 'block';
    throw new Error('E2EE requires a secure context (HTTPS).');
  }

  const socket = io();
  let cryptoKey = null;
  let currentNick = '';
  let currentRoomId = '';
  
  // Надежная генерация случайных строк без Math.random()
  function getSecureRandomString() {
    if (window.crypto.randomUUID) return window.crypto.randomUUID();
    const arr = new Uint8Array(16);
    window.crypto.getRandomValues(arr);
    return Array.from(arr, byte => byte.toString(16).padStart(2, '0')).join('');
  }

  const sessionToken = getSecureRandomString();
  const seenMessages = new Set();
  const MESSAGE_TTL = 5 * 60 * 1000; // Жизненный цикл сообщения: 5 минут (защита от старых Replay)

  async function generateKey() {
    return await window.crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  }

  async function exportKeyBase64(key) {
    const exported = await window.crypto.subtle.exportKey("raw", key);
    return btoa(String.fromCharCode(...new Uint8Array(exported)));
  }

  async function importKeyBase64(base64Key) {
    const raw = Uint8Array.from(atob(base64Key), c => c.charCodeAt(0));
    return await window.crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const roomIdParam = hashParams.get('id');
    const keyParam = hashParams.get('key');

    if (roomIdParam) document.getElementById('roomIdInput').value = roomIdParam;
    
    if (keyParam) {
      try { 
        cryptoKey = await importKeyBase64(decodeURIComponent(keyParam)); 
        // Удаляем ключ из истории браузера и адресной строки
        window.history.replaceState(null, '', window.location.pathname);
      } catch (e) {
        console.error("Key import failed", e);
      }
    }
  });

  socket.on('connect', () => {
    if (currentRoomId && currentNick) {
      socket.emit('join_room', { roomId: currentRoomId, sessionToken });
    }
  });

  async function createRoom() {
    currentNick = document.getElementById('nickInput').value.trim() || 'Создатель чата';
    cryptoKey = await generateKey();
    const keyString = await exportKeyBase64(cryptoKey);
    window.tempKeyString = keyString;
    socket.emit('create_room', { sessionToken });
  }

  socket.on('room_created', ({ roomId }) => {
    currentRoomId = roomId;
    setupChatUI(roomId);
    
    const inviteUrl = `${window.location.origin}${window.location.pathname}#id=${roomId}&key=${encodeURIComponent(window.tempKeyString)}`;
    
    // Формируем безопасную ссылку для приглашения
    addSystemMessage(`Комната создана! Передайте эту ссылку собеседнику (она содержит ключ).`);
    
    const box = document.getElementById('chatBox');
    const linkDiv = document.createElement('div');
    linkDiv.style.background = '#27272a'; linkDiv.style.padding = '10px'; linkDiv.style.borderRadius = '8px';
    linkDiv.innerHTML = `
      <input type="text" value="${inviteUrl}" readonly id="inviteLinkInput" style="margin-top:0;" />
      <button class="copy-btn" onclick="copyInviteLink()">Скопировать ссылку</button>
    `;
    box.appendChild(linkDiv);
    box.scrollTop = box.scrollHeight;
  });

  window.copyInviteLink = function() {
    const input = document.getElementById('inviteLinkInput');
    input.select();
    document.execCommand('copy');
    alert('Ссылка скопирована!');
  };

  async function joinRoom() {
    currentNick = document.getElementById('nickInput').value.trim() || 'Гость чата';
    const roomId = document.getElementById('roomIdInput').value.trim();
    if (!roomId) return alert('Введите ID комнаты');
    currentRoomId = roomId;

    if (!cryptoKey) {
      return alert('Ошибка: Ключ шифрования не найден в памяти. Пожалуйста, перейдите по полной ссылке-приглашению.');
    }

    setupChatUI(roomId);
    socket.emit('join_room', { roomId, sessionToken });
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !cryptoKey) return;

    try {
      const enc = new TextEncoder();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      
      // Генерируем ID с меткой времени
      const msgId = `${Date.now()}_${getSecureRandomString()}`;

      const encryptedContent = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        enc.encode(JSON.stringify({ user: currentNick, text: text, msgId: msgId }))
      );

      seenMessages.add(msgId);

      socket.emit('send_encrypted_message', {
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encryptedContent))
      });

      appendMessage(currentNick, text, true);
      input.value = '';
    } catch (err) {
      addSystemMessage('Ошибка при шифровании.');
    }
  }

  socket.on('receive_encrypted_message', async ({ iv, data }) => {
    if (!cryptoKey) return;
    try {
      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: new Uint8Array(iv) },
        cryptoKey,
        new Uint8Array(data)
      );
      const payload = JSON.parse(new TextDecoder().decode(decrypted));
      
      // Жесткая проверка от Replay: возраст + дубликаты
      if (payload.msgId) {
        const parts = payload.msgId.split('_');
        if (parts.length === 2) {
          const timestamp = parseInt(parts[0], 10);
          if (Date.now() - timestamp > MESSAGE_TTL) return; // Пакет слишком старый
        }
        if (seenMessages.has(payload.msgId)) return;
        seenMessages.add(payload.msgId);
      }

      appendMessage(payload.user, payload.text, false);
    } catch (e) {
      console.warn('Ошибка расшифровки пакета', e);
    }
  });

  socket.on('chat_ready', ({ message }) => addSystemMessage(message));
  socket.on('peer_paused', ({ message }) => addSystemMessage(message));
  socket.on('error_message', (msg) => alert(msg));
  socket.on('security_breach', (msg) => selfDestruct(msg));
  socket.on('room_destroyed', (msg) => selfDestruct(msg));

  function destroyChatManual() { socket.emit('destroy_room_manual'); }

  function selfDestruct(reason) {
    alert(reason);
    cryptoKey = null;
    document.getElementById('chatBox').innerHTML = '';
    window.location.hash = '';
    window.location.href = 'about:blank';
  }

  function setupChatUI(roomId) {
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('chatScreen').classList.remove('hidden');
    const displayId = roomId.length > 8 ? roomId.substring(0, 8) + '...' : roomId;
    document.getElementById('displayRoomId').innerText = displayId;
    document.getElementById('displayRoomId').title = roomId;
  }

  function appendMessage(author, text, isMy) {
    const box = document.getElementById('chatBox');
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${isMy ? 'my' : 'peer'}`;

    const authorSpan = document.createElement('span');
    authorSpan.className = 'author';
    authorSpan.innerText = author;

    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg';
    msgDiv.innerText = text;

    wrapper.appendChild(authorSpan);
    wrapper.appendChild(msgDiv);
    
    box.appendChild(wrapper);
    box.scrollTop = box.scrollHeight;
  }

  function addSystemMessage(text) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = 'msg sys';
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
